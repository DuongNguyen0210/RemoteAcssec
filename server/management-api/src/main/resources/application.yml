server:
  port: 9090

jwt:
  secret: ${JWT_SECRET}

spring:
  application:
    name: management-api
  config:
    # Support IDE working directories: repository root, server, and management-api.
    import: "optional:file:./infrastructure/.env[.properties],optional:file:../infrastructure/.env[.properties],optional:file:../../infrastructure/.env[.properties]"

  datasource:
    url: jdbc:postgresql://localhost:5432/remote_db
    username: admin
    password: password123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
