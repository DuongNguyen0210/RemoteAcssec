server:
  port: 8080

spring:
  application:
    name: management-api

  datasource:
    url: jdbc:postgresql://localhost:5432/remote_db
    username: admin
    password: password123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update # Tự động tạo hoặc cập nhật bảng trong Database dựa theo Code Java
    show-sql: true     # In ra console các câu lệnh SQL để dễ debug
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Cấu hình kết nối Redis
  data:
    redis:
      host: localhost
      port: 6379
