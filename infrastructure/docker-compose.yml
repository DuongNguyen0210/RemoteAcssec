name: remote-access

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-remote_db}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infrastructure/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  management-api-1: &management-api
    build:
      context: ..
      dockerfile: infrastructure/docker/management-api.Dockerfile
    environment:
      SERVER_PORT: 9090
      SPRING_DATASOURCE_URL: ${DATABASE_JDBC_URL:?Set DATABASE_JDBC_URL in infrastructure/.env}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infrastructure/.env}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in infrastructure/.env}
      RELAY_NODE_TOKEN: ${RELAY_NODE_TOKEN:?Set RELAY_NODE_TOKEN in infrastructure/.env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:9090/health]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  management-api-2:
    <<: *management-api

  relay-proxy-1:
    build:
      context: ..
      dockerfile: infrastructure/docker/relay-proxy.Dockerfile
    environment: &relay-environment
      RELAY_INSTANCE_ID: relay-proxy-1
      RELAY_PORT: 8080
      RELAY_ADVERTISED_HOST: ${RELAY_1_ADVERTISED_HOST:-localhost}
      RELAY_ADVERTISED_PORT: ${RELAY_1_PUBLIC_PORT:-9091}
      RELAY_CAPACITY: ${RELAY_CAPACITY:-1000}
      RELAY_DISCOVERY_ENABLED: 'true'
      RELAY_NODE_TOKEN: ${RELAY_NODE_TOKEN:?Set RELAY_NODE_TOKEN in infrastructure/.env}
      MANAGEMENT_API_URL: ${RELAY_MANAGEMENT_URL:-http://nginx:9090}
    ports:
      - '${RELAY_1_PUBLIC_PORT:-9091}:8080'
    depends_on:
      nginx:
        condition: service_started
    restart: unless-stopped

  relay-proxy-2:
    build:
      context: ..
      dockerfile: infrastructure/docker/relay-proxy.Dockerfile
    environment:
      <<: *relay-environment
      RELAY_INSTANCE_ID: relay-proxy-2
      RELAY_ADVERTISED_HOST: ${RELAY_2_ADVERTISED_HOST:-localhost}
      RELAY_ADVERTISED_PORT: ${RELAY_2_PUBLIC_PORT:-9092}
    ports:
      - '${RELAY_2_PUBLIC_PORT:-9092}:8080'
    depends_on:
      nginx:
        condition: service_started
    restart: unless-stopped

  nginx:
    image: nginx:1.28-alpine
    environment:
      API_UPSTREAM_1: ${API_UPSTREAM_1:-management-api-1:9090}
      API_UPSTREAM_2: ${API_UPSTREAM_2:-management-api-2:9090}
      API_DNS_RESOLVER: ${API_DNS_RESOLVER:-127.0.0.11}
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: '^API_'
    ports:
      - '${MANAGEMENT_PUBLIC_BIND:-0.0.0.0}:${MANAGEMENT_PUBLIC_PORT:-80}:80'
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
    depends_on:
      management-api-1:
        condition: service_healthy
      management-api-2:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
