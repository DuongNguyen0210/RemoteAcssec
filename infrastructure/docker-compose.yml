version: '3.8'

services:
  nginx-lb:
    image: nginx:latest
    ports:
      - "80:80"
      - "8080:8080" # Relay TCP Load Balancing
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - management-api
      - relay-proxy-1
      - relay-proxy-2

  management-api:
    image: openjdk:17-alpine
    # This is a placeholder. Normally we'd build the jar and mount/copy it.
    command: tail -f /dev/null

  relay-proxy-1:
    image: openjdk:17-alpine
    command: tail -f /dev/null
  
  relay-proxy-2:
    image: openjdk:17-alpine
    command: tail -f /dev/null
