services:
  postgres:
    image: postgres:15-alpine
    container_name: remote_control_db
    environment:
      POSTGRES_DB: remote_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: remote_control_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres_data:
