worker_processes auto;
events { worker_connections 1024; }
http {
    upstream management_api { server management-api:9090; }
    server {
        listen 80;
        client_max_body_size 1m;
        location /internal/ { return 404; }
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;

        location = /api/v1/devices/events {
            proxy_pass http://management_api;
            proxy_buffering off;
            # Spring's SSE emitter can remain open for 60 seconds without an event.
            proxy_read_timeout 75s;
        }
        location /api/ { proxy_pass http://management_api; }
        location / { return 404; }
    }
}
